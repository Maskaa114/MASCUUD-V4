  return `<div class="btnrow" style="margin-bottom:10px"><button class="btn sm ghost" onclick="exportCSV('teachers')">⬇ CSV</button></div>
    <div style="overflow:auto"><table>
    <tr><th>${t("Name","Magac")}</th><th>${t("School","Dugsi")}</th><th>${t("Zone/Woreda","Gobol/Degmo")}</th><th>${t("Modules","Cutubyo")}</th><th></th></tr>
    ${rows}</table></div>`;
}
function delTeacher(id){if(!confirm(t("Delete this teacher and their progress?","Ma tirtiraysaa macallinkan iyo horumarkiisa?")))return;
  DB.teachers=DB.teachers.filter(x=>x.id!==id);delete DB.progress[id];
  DB.results=DB.results.filter(r=>r.teacherId!==id);
  if(DB.currentTeacher===id)DB.currentTeacher=null;saveDB();go("admin",{atab:"teachers"});}
function teacherName(id){const t2=DB.teachers.find(x=>x.id===id);return t2?t2.fullName:"?";}
function adminResults(){
  if(!DB.results.length)return `<p class="muted">${t("No exam attempts yet.","Weli isku-day imtixaan ma jiro.")}</p>`;
  const rows=DB.results.slice().reverse().slice(0,300).map(r=>{
    const label=r.type==="final"?t("Final","Dhammaad"):(t("Module","Cutub")+" "+r.mid);
    const status=r.terminated?`<span class="tag fail">${t("Stopped","La joojiyay")}</span>`:
      (r.passed?`<span class="tag pass">${t("Pass","Gudbay")}</span>`:`<span class="tag fail">${t("Not yet","Weli")}</span>`);
    return `<tr><td>${esc(teacherName(r.teacherId))}</td><td>${label}${r.attempt?` #${r.attempt}`:""}</td><td>${r.pct}% (${r.score}/${r.total})</td>
      <td>${status}</td><td class="muted small">${esc((r.date||"").slice(0,10))}</td></tr>`;}).join("");
  return `<div class="btnrow" style="margin-bottom:10px"><button class="btn sm ghost" onclick="exportCSV('results')">⬇ CSV</button></div>
    <div style="overflow:auto"><table>
    <tr><th>${t("Teacher","Macallin")}</th><th>${t("Exam","Imtixaan")}</th><th>${t("Score","Natiijo")}</th><th>${t("Status","Xaalad")}</th><th>${t("Date","Taariikh")}</th></tr>
    ${rows}</table></div>`;
}
function adminCerts(){
  if(!DB.certificates.length)return `<p class="muted">${t("No certificates issued yet.","Weli shahaado lama bixin.")}</p>`;
  const rows=DB.certificates.slice().reverse().map(c=>`<tr>
    <td>${esc(c.certNo)}</td><td>${esc(c.name)}</td><td>${c.score}%</td>
    <td>${esc(c.verifyCode)}</td>
    <td><button class="btn sm ghost" onclick="go('certificate',{certNo:'${c.certNo}',from:'admin'})">${t("View","Arag")}</button>
        <button class="btn sm ghost" onclick="toggleRevoke('${c.certNo}')">${c.status==='VALID'?t("Revoke","Baaji"):t("Restore","Soo celi")}</button></td></tr>`).join("");
  return `<div class="btnrow" style="margin-bottom:10px"><button class="btn sm ghost" onclick="exportCSV('certs')">⬇ CSV</button></div>
    <div style="overflow:auto"><table>
    <tr><th>${t("Certificate No.","Lambar")}</th><th>${t("Teacher","Macallin")}</th><th>${t("Score","Natiijo")}</th><th>${t("Verify code","Koodh")}</th><th></th></tr>
    ${rows}</table></div>`;
}
function toggleRevoke(no){const c=DB.certificates.find(x=>x.certNo===no);if(!c)return;
  c.status=c.status==="VALID"?"REVOKED":"VALID";saveDB();go("admin",{atab:"certs"});}
function adminQuestions(){
  const opts=RAW_MODULES.map(m=>`<option value="${m.id}">${t("Module","Cutub")} ${m.id} — ${esc(m.title)} (${bankFor(m.id).length})</option>`).join("");
  return `<h3>${t("Question banks","Bangiyada su’aalaha")}</h3>
   <p class="muted small">${t("Each module has built-in questions plus any you add here. Module tests draw","Cutub kastaa wuxuu leeyahay su’aalo asal ah iyo kuwa aad halkan ku darto. Imtixaanka cutubku wuxuu si kala daadsan u soo qaadaa")} ${DB.settings.moduleTestCount}.</p>
   <table style="max-width:560px"><tr><th>${t("Module","Cutub")}</th><th>${t("Built-in","Asal")}</th><th>${t("Added","La daray")}</th></tr>
     ${RAW_MODULES.map(m=>`<tr><td>${m.id}: ${esc(m.title)}</td><td>${m.questions.length}</td><td>${(DB.customQuestions[m.id]||[]).length}</td></tr>`).join("")}</table>
   <hr class="hr"><h3>${t("Add a question","Ku dar su’aal")}</h3>
   <label class="f">${t("Module","Cutub")}</label><select id="aq_m">${opts}</select>
   <label class="f">${t("Question (Somali)","Su’aasha")}</label><input id="aq_q">
   <div class="grid2">
     ${[0,1,2,3].map(i=>`<div><label class="f">${t("Option","Doorasho")} ${"ABCD"[i]}</label><input id="aq_o${i}"></div>`).join("")}
   </div>
   <label class="f">${t("Correct option","Doorashada saxda ah")}</label>
   <select id="aq_a"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
   <label class="f">${t("Short explanation (shown after the test)","Sharraxaad gaaban (waxaa la muujiyaa imtixaanka kadib)")}</label><input id="aq_s">
   <div style="margin-top:14px"><button class="btn" onclick="addQuestion()">${t("Add question","Ku dar su’aal")}</button></div>`;
}
function addQuestion(){
  const mid=+$("#aq_m").value;
  const q=$("#aq_q").value.trim();
  const o=[0,1,2,3].map(i=>$("#aq_o"+i).value.trim());
  if(!q||o.some(x=>!x)){toast(t("Fill the question and all four options.","Buuxi su’aasha iyo afarta doorasho."));return;}
  DB.customQuestions[mid]=DB.customQuestions[mid]||[];
  DB.customQuestions[mid].push({q,o,a:+$("#aq_a").value,s:$("#aq_s").value.trim()});
  saveDB();toast(t("Question added.","Su’aal waa lagu daray."));go("admin",{atab:"questions"});
}
function adminSettings(){
  const s=DB.settings;
  const f=(id,label,val)=>`<div><label class="f">${label}</label><input id="${id}" type="number" value="${val}"></div>`;
  const yn=(id,label,val)=>`<div><label class="f">${label}</label><select id="${id}"><option value="1"${val?" selected":""}>${t("Yes","Haa")}</option><option value="0"${val?"":" selected"}>${t("No","Maya")}</option></select></div>`;
  return `<h3>${t("Settings","Habaynta")}</h3><div class="grid2">
    ${f("s_mp",t("Module pass %","Gudubka cutubka %"),s.modulePassPct)}
    ${f("s_fp",t("Final pass %","Gudubka dhammaadka %"),s.finalPassPct)}
    ${f("s_mc",t("Module test questions","Su’aalaha imtixaanka cutubka"),s.moduleTestCount)}
    ${f("s_fpm",t("Final questions per module","Su’aalaha dhammaadka ee cutub kasta"),s.finalPerModule)}
    ${f("s_mt",t("Module time (min)","Waqtiga cutubka (daq)"),s.moduleTimeMin)}
    ${f("s_ft",t("Final time (min)","Waqtiga dhammaadka (daq)"),s.finalTimeMin)}
    ${f("s_lock",t("Wait after a stopped exam (min)","Sugitaanka kadib imtixaan la joojiyay (daq)"),s.examLockoutMin)}
    ${f("s_leave",t("Warnings before the exam stops","Digniinaha kahor joojinta"),s.allowedLeaves)}
    ${yn("s_rr",t("Must read all lessons before the test","Waa in casharrada oo dhan la akhriyo kahor imtixaanka"),s.requireReading)}
    ${yn("s_sa",t("Show correct answers after module test","Muuji jawaabaha saxda ah imtixaanka cutubka kadib"),s.showAnswers)}
    <div><label class="f">${t("Default zone on registration","Gobolka caadiga ah ee diiwaangelinta")}</label><input id="s_zone" value="${esc(s.zoneDefault)}"></div>
    <div><label class="f">${t("Admin password","Furaha maamulaha")}</label><input id="s_pass" value="${esc(s.adminPass)}"></div>
    </div>
    <div style="margin-top:14px"><button class="btn" onclick="saveSettings()">${t("Save settings","Kaydi habaynta")}</button></div>`;
}
function saveSettings(){
  const s=DB.settings;const n=(id,d)=>{const v=parseInt($("#"+id).value,10);return isNaN(v)?d:v;};
  s.modulePassPct=Math.min(100,Math.max(1,n("s_mp",60)));s.finalPassPct=Math.min(100,Math.max(1,n("s_fp",60)));
  s.moduleTestCount=Math.max(1,n("s_mc",10));s.finalPerModule=Math.max(1,n("s_fpm",8));
  s.moduleTimeMin=Math.max(1,n("s_mt",20));s.finalTimeMin=Math.max(1,n("s_ft",60));
  s.examLockoutMin=Math.max(0,n("s_lock",15));s.allowedLeaves=Math.max(0,n("s_leave",2));
  s.requireReading=n("s_rr",1);s.showAnswers=n("s_sa",1);
  s.zoneDefault=$("#s_zone").value.trim()||"Jarar";
  const pw=$("#s_pass").value.trim();if(pw)s.adminPass=pw;
  saveDB();toast(t("Settings saved.","Habaynta waa la kaydiyay."));go("admin",{atab:"settings"});
}
function adminData(){
  return `<h3>${t("Backup &amp; Restore","Kaydin &amp; Soo celin")}</h3>
   <p class="muted small">${t("Export all data (teachers, progress, results, certificates, questions, settings) to a JSON file. Import it later on this or another computer.","Soo saar xogta oo dhan (macallimiin, horumar, natiijooyin, shahaadooyin, su’aalo, habayn) fayl JSON ah. Mar dambe ku soo celi kombiyuutarkan ama mid kale.")}</p>
   <div class="btnrow">
     <button class="btn" onclick="exportData()">⬇ ${t("Export backup (JSON)","Soo saar kaydin (JSON)")}</button>
     <label class="btn ghost" style="cursor:pointer">⬆ ${t("Import backup","Soo geli kaydin")}
       <input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>
   </div>
   <hr class="hr">
   <h3 style="color:var(--red)">${t("Danger zone","Aag khatar ah")}</h3>
   <button class="btn ghost" style="border-color:var(--red);color:var(--red)" onclick="wipeAll()">${t("Erase ALL data","Tirtir XOGTA OO DHAN")}</button>`;
}
function download(name,text,type){
  const blob=new Blob([text],{type});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function exportData(){
  const clone=Object.assign({},DB);delete clone._adminOK;
  download("SREB_TTP_backup_"+todayStr()+".json",JSON.stringify(clone,null,2),"application/json");
  toast(t("Backup downloaded.","Kaydinta waa la soo dejiyay."));
}
function exportCSV(kind){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  let rows;
  if(kind==="teachers")rows=[["Name","Phone","School","Zone","Woreda","Grades","Gender","Modules passed","Certificate"]].concat(
    DB.teachers.map(tc=>{const p=DB.progress[tc.id]||{moduleStatus:{}};return [tc.fullName,tc.phone,tc.school,tc.zone,tc.woreda,tc.grades,tc.gender,
      MIDS.filter(i=>p.moduleStatus[i]==="done").length,p.certNo||""];}));
  else if(kind==="results")rows=[["Teacher","Exam","Attempt","Score","Total","Percent","Status","Date"]].concat(
    DB.results.map(r=>[teacherName(r.teacherId),r.type==="final"?"Final":"Module "+r.mid,r.attempt||"",r.score,r.total,r.pct,
      r.terminated?"Stopped":(r.passed?"Pass":"Not yet"),(r.date||"").slice(0,10)]));
  else rows=[["Certificate No","Verify code","Name","School","Zone","Woreda","Score","Date","Status"]].concat(
    DB.certificates.map(c=>[c.certNo,c.verifyCode,c.name,c.school,c.zone,c.woreda,c.score,c.date,c.status]));
  download("SREB_"+kind+"_"+todayStr()+".csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");
}
function importData(ev){
  const file=ev.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(!d.teachers||!d.settings)throw new Error("bad");
    if(!confirm(t("This will replace all current data. Continue?","Tani waxay beddeli doontaa xogta hadda oo dhan. Ma sii wadaa?")))return;
    d.settings=Object.assign({},defaultSettings,d.settings);
    d.customQuestions=Object.assign(emptyCustom(),d.customQuestions||{});
    DB=d;DB._adminOK=true;LANG=DB.lang||"so";saveDB();
    toast(t("Backup imported.","Kaydinta waa la soo celiyay."));go("admin",{atab:"overview"});
  }catch(e){toast(t("Invalid backup file.","Faylka kaydinta waa khalad."));}};
  rd.readAsText(file);
}
function wipeAll(){
  if(!confirm(t("Erase ALL teachers, results and certificates? This cannot be undone.","Ma tirtiraysaa DHAMMAAN macallimiinta, natiijooyinka iyo shahaadooyinka? Dib looma soo celin karo.")))return;
  if(!confirm(t("Are you absolutely sure?","Ma hubtaa gebi ahaanba?")))return;
  DB=freshDB();DB._adminOK=true;saveDB();toast(t("All data erased.","Xogta oo dhan waa la tirtiray."));go("admin",{atab:"overview"});
}

/* ---- boot ---- */
render();
</script>
</body>
</html>
