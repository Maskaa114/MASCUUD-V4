<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tababarka Macallimiinta · SREB</title>
<style>
:root{
  --plum:#4C1D63; --plum-d:#33143f; --plum-l:#6d2f88;
  --gold:#C9A227; --gold-d:#a4831a; --gold-l:#f3e3a6; --green:#2E7D46; --green-d:#1f5c31;
  --ink:#2a2230; --muted:#6b6472; --line:#e6e0ec;
  --bg:#f5f3f7; --card:#ffffff; --so-bg:#f4eefa; --red:#b3261e;
  --shadow:0 1px 3px rgba(40,20,50,.08),0 6px 20px rgba(40,20,50,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em}
a{color:var(--plum-l)}
.serif{font-family:Georgia,"Times New Roman",serif}
img{max-width:100%}
.hide{display:none!important}

/* ---------- top bar ---------- */
.topbar{background:linear-gradient(120deg,var(--plum-d),var(--plum));color:#fff;
  display:flex;align-items:center;gap:14px;padding:12px 20px;box-shadow:var(--shadow);
  position:sticky;top:0;z-index:40;flex-wrap:wrap}
.topbar .logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;flex:0 0 auto}
.topbar .tt{flex:1;min-width:180px}
.topbar .tt b{display:block;font-size:15px;letter-spacing:.2px}
.topbar .tt span{display:block;font-size:12px;color:#e7d7f2}
.topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
.langbtn:hover{background:rgba(255,255,255,.24)}
.iconbtn{background:transparent;color:#e7d7f2;border:1px solid rgba(255,255,255,.25);
  border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.iconbtn:hover{color:#fff;border-color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{color:var(--plum)}
.eg{background:#fbf7ee;border:1px solid #ecdcb6;border-left:4px solid var(--gold);
  border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-size:15px}
.eg b{color:var(--gold-d)}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:220px}
.hero{background:linear-gradient(135deg,var(--plum-d),var(--plum) 60%,var(--plum-l));color:#fff;border:none}
.hero h1{color:#fff}
.hero p{color:#eadcf3}
.hero .goldline{width:80px;height:3px;background:var(--gold);margin:10px auto;border-radius:3px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.feat div{background:#fbfafd;border:1px solid var(--line);border-radius:12px;padding:14px}
.feat b{display:block;color:var(--plum);margin-bottom:2px}
.feat span{font-size:13.5px;color:var(--muted)}
.feat i{font-style:normal;font-size:22px;display:block;margin-bottom:4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--plum);color:#fff;border:none;border-radius:10px;padding:13px 20px;
  font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;font-family:inherit}
.btn:hover{background:var(--plum-l)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.gold{background:var(--gold-d)} .btn.gold:hover{background:var(--gold)}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--plum);border:1.5px solid var(--plum)}
.btn.ghost:hover{background:var(--so-bg)}
.btn.light{background:#fff;color:var(--plum)} .btn.light:hover{background:var(--gold-l)}
.btn.grey{background:#ece8f0;color:var(--muted);cursor:not-allowed}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:8px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- forms ---------- */
label.f{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
label.f em{font-style:normal;color:var(--plum-l);font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--plum-l);
  box-shadow:0 0 0 3px rgba(109,47,136,.12)}
.field-err{color:var(--red);font-size:13px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* ---------- progress ---------- */
.pbar{height:14px;background:#ece8f0;border-radius:999px;overflow:hidden}
.pbar.thin{height:8px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));
  border-radius:999px;transition:width .5s}
.pct{font-weight:700;color:var(--green-d)}

/* ---------- module pathway ---------- */
.mlist{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);
  border-radius:12px;padding:14px 16px;background:#fff;transition:.15s;flex-wrap:wrap}
.mrow.avail{border-color:var(--plum-l);box-shadow:0 0 0 3px rgba(109,47,136,.08)}
.mrow.done{border-color:var(--green);background:#f4fbf6}
.mrow.locked{opacity:.72;background:#faf8fc}
.mrow .badge{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700}
.badge.b-done{background:var(--green)} .badge.b-avail{background:var(--plum)}
.badge.b-locked{background:#c9c2d1}
.mrow .mt{flex:1;min-width:180px}
.mrow .mt b{display:block;font-size:15px}
.mrow .mt span{display:block;font-size:12.5px;color:var(--muted)}
.mrow .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.s-done{background:#dff3e6;color:var(--green-d)}
.st.s-avail{background:#efe4f6;color:var(--plum)}
.st.s-locked{background:#eee;color:#8a8391}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--so-bg);color:var(--plum-l);margin-left:6px}
.pill.new{background:var(--gold-l);color:#6b5410}

/* ---------- lessons ---------- */
.lesson{border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;background:#fff}
.lesson.read{border-color:#bfe3cb}
.lesson>summary{cursor:pointer;padding:14px 16px;font-weight:700;color:var(--plum);
  background:#fbfafd;list-style:none;display:flex;align-items:center;gap:10px}
.lesson>summary::-webkit-details-marker{display:none}
.lesson>summary .num{background:var(--plum);color:#fff;width:28px;height:28px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.lesson.read>summary .num{background:var(--green)}
.lesson>summary .chk{margin-left:auto;font-size:12px;color:var(--green-d);font-weight:700}
.lesson[open]>summary{border-bottom:1px solid var(--line)}
.lesson .body{padding:12px 18px 16px}
.lesson .body ul{padding-left:20px;margin:6px 0} .lesson .body li{margin:6px 0}
.idea{background:var(--so-bg);border-left:4px solid var(--plum-l);border-radius:0 10px 10px 0;padding:10px 14px;margin:4px 0 10px;font-size:16.5px}
.blk-h{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--plum-l);margin:10px 0 2px}
.try{background:#eefaf1;border:1px solid #c5e8d0;border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0 4px}
.try b{color:var(--green-d)}
.obj{padding-left:22px;margin:6px 0} .obj li{margin:6px 0}
.remember{background:linear-gradient(135deg,#fffaf0,#fbf3dc);border:1.5px solid var(--gold);border-radius:12px;padding:14px 18px}
.remember h3{color:var(--gold-d)}
.remember li{margin:5px 0}

/* ---------- exam ---------- */
.exam-shell{max-width:820px;margin:0 auto;padding:18px}
.exam-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--plum-d);color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:14px;
  position:sticky;top:8px;z-index:10;flex-wrap:wrap}
.exam-head .timer{font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);
  padding:5px 12px;border-radius:999px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.q .qn{font-size:12px;font-weight:700;color:var(--plum-l);letter-spacing:.4px}
.q .qtext{font-weight:700;margin:6px 0 10px;font-size:17px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);
  border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--plum-l);background:#fbfafd}
.opt.sel{border-color:var(--plum);background:var(--so-bg)}
.opt input{width:auto;margin-top:3px;accent-color:var(--plum)}
.opt.correct{border-color:var(--green);background:#eefaf1}
.opt.wrong{border-color:var(--red);background:#fdeeed}
.expl{font-size:14.5px;margin-top:8px;padding:8px 12px;border-radius:8px;background:#f6f3f9;color:#4a3d55}
.warnbox{position:fixed;inset:0;background:rgba(30,10,40,.86);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:20px}
.warnbox .inner{background:#fff;border-radius:16px;max-width:460px;padding:28px;text-align:center}
.warnbox h2{color:var(--red)}
.no-select{user-select:none;-webkit-user-select:none}

/* ---------- result ---------- */
.result-big{font-size:56px;font-weight:800;line-height:1}
.result-pass{color:var(--green-d)} .result-fail{color:var(--red)}
.rv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;text-align:left;background:#fff}
.rv .bad{color:var(--red)} .rv .good{color:var(--green-d)}

/* ---------- certificate ---------- */
#certFit{width:100%;overflow:hidden;margin:0 auto}
#certArea{background:#e9e3ef;padding:16px;border-radius:14px}
.cert{position:relative;width:1123px;height:794px;transform-origin:top left;overflow:hidden;
  background:#fffdf6;color:#2b2233;font-family:Georgia,"Times New Roman",serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:0 10px 40px rgba(40,20,50,.22)}
.cert .bgpat{position:absolute;inset:0;opacity:.55;
  background:
    radial-gradient(circle at 50% 50%,rgba(201,162,39,.10) 0,rgba(201,162,39,0) 55%),
    repeating-radial-gradient(circle at 50% 50%,rgba(76,29,99,.035) 0 2px,transparent 2px 9px)}
.cert .frame1{position:absolute;inset:14px;border:12px solid var(--plum);}
.cert .frame2{position:absolute;inset:32px;border:2.5px solid var(--gold-d)}
.cert .frame3{position:absolute;inset:39px;border:1px solid var(--gold)}
.cert .corner{position:absolute;width:92px;height:92px}
.cert .corner.tl{top:26px;left:26px}
.cert .corner.tr{top:26px;right:26px;transform:scaleX(-1)}
.cert .corner.bl{bottom:26px;left:26px;transform:scaleY(-1)}
.cert .corner.br{bottom:26px;right:26px;transform:scale(-1,-1)}
.cert .wm{position:absolute;top:50%;left:50%;width:430px;transform:translate(-50%,-46%);opacity:.055;pointer-events:none}
.cert .inner{position:absolute;inset:54px 70px 56px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .chead{display:flex;align-items:center;justify-content:center;gap:16px}
.cert .chead img{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold);background:#fff}
.cert .bureau{color:var(--plum);font-size:20px;font-weight:700;letter-spacing:1.5px;line-height:1.25;text-align:left}
.cert .bureau small{display:block;font-size:12.5px;color:#6b5f74;letter-spacing:2px;font-weight:600;font-family:system-ui,Segoe UI,Arial,sans-serif}
.cert .ctitle{font-size:54px;color:var(--gold-d);letter-spacing:10px;margin:8px 0 0;line-height:1;font-weight:700;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(164,131,26,.25)}
.cert .csub{font-size:12.5px;color:var(--plum);letter-spacing:2.2px;white-space:nowrap;text-transform:uppercase;font-family:system-ui,Segoe UI,Arial,sans-serif;font-weight:700;margin-top:6px}
.cert .orn{display:flex;align-items:center;gap:10px;color:var(--gold-d);margin:4px 0 2px}
.cert .orn i{display:block;width:120px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold-d))}
.cert .orn i:last-child{background:linear-gradient(90deg,var(--gold-d),transparent)}
.cert .cline{font-size:16px;color:#4a4152;font-style:italic}
.cert .cname{font-size:42px;color:var(--plum-d);margin:4px 0 2px;padding:0 40px 4px;border-bottom:2px solid var(--gold);font-style:italic;line-height:1.15;max-width:900px}
.cert .cprog{font-size:15px;color:#3b3244;max-width:840px;line-height:1.45;margin-top:6px}
.cert .cprog b{color:var(--plum)}
.cert .mods{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:8px 0 0;max-width:960px}
.cert .mods span{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:700;color:var(--plum);
  background:#f4eefa;border:1px solid #dccbe8;border-radius:999px;padding:3px 9px}
.cert .mods span:before{content:"\2713 ";color:var(--green)}
.cert .cmeta{display:grid;grid-template-columns:1.25fr 1fr 1.1fr .85fr;gap:0;margin:10px 0 0;width:100%;max-width:900px;
  border-top:1px solid #e6d9b8;border-bottom:1px solid #e6d9b8;font-family:system-ui,Segoe UI,Arial,sans-serif}
.cert .cmeta div{padding:5px 8px;border-right:1px solid #efe5cb}
.cert .cmeta div:last-child{border-right:none}
.cert .cmeta small{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#8a7d93;font-weight:700}
.cert .cmeta b{font-size:14px;color:var(--plum-d)}
.cert .grade{display:inline-block;margin-top:2px;font-size:11px;font-weight:800;color:#6b5410;background:var(--gold-l);border-radius:999px;padding:1px 8px}
.cert .motto{margin-top:14px;font-style:italic;color:var(--gold-d);font-size:16px}
.cert .cbottom{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 130px 1fr;align-items:end;gap:20px}
.cert .sig{text-align:center;font-family:system-ui,Segoe UI,Arial,sans-serif}
.cert .sig .ln{border-top:1.5px solid #4a4152;margin:0 20px;padding-top:5px;font-size:13px;font-weight:700;color:#3b3244}
.cert .sig .ln span{display:block;font-weight:500;color:#7a6f83;font-size:11.5px}
.cert .sigs{display:flex;gap:10px}
.cert .sigs .sig{flex:1}
.cert .sigs .sig .ln{margin:0 6px}
.cert .seal{width:116px;display:block;margin:0 auto}
.cert .vbox{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;font-family:system-ui,Segoe UI,Arial,sans-serif;text-align:left}
.cert .vinfo{font-size:11px;color:#5f566a;line-height:1.55}
.cert .vinfo b{color:var(--plum-d);font-size:12px}
.cert .qr{width:92px;height:92px;flex:0 0 auto;background:#fff;padding:3px;border:1px solid #e6d9b8}
.cert .qr img{width:100%!important;height:100%!important;display:block}
.cert .sample{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);
  font-family:system-ui,Arial,sans-serif;font-size:80px;font-weight:900;letter-spacing:8px;color:rgba(179,38,30,.13);
  white-space:nowrap;pointer-events:none;border:10px solid rgba(179,38,30,.13);padding:0 30px;border-radius:20px}

/* ---------- admin / tables ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;
  cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--plum);color:#fff;border-color:var(--plum)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--plum);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:#fbfafd}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.pass{background:#dff3e6;color:var(--green-d)} .tag.fail{background:#fdeeed;color:var(--red)}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat .box{flex:1;min-width:130px;background:#fbfafd;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .box b{display:block;font-size:28px;color:var(--plum)}
.stat .box span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:300;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.footer{text-align:center;color:var(--muted);font-size:12.5px;padding:20px}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}

/* ---------- toolkit ---------- */
.rules{counter-reset:r;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:0;list-style:none}
.rules li{counter-increment:r;background:#fbfafd;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 48px;position:relative}
.rules li:before{content:counter(r);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--plum);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.rules b{display:block;color:var(--plum)}
.checks li{list-style:none;margin:6px 0}
.checks li:before{content:"\2610  ";font-size:18px;color:var(--plum)}
.plan td:first-child{width:38%;font-weight:600;color:var(--plum);background:#fbfafd}
.plan td{height:38px;border:1px solid var(--line)}

@media print{
  .topbar,.footer,.noprint,.toast{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body.print-cert .wrap>*:not(#certFit){display:none!important}
  body.print-cert #certArea{padding:0;background:none;border-radius:0}
  body.print-cert #certFit{height:auto!important;overflow:visible}
  body.print-cert .cert{transform:none!important;box-shadow:none}
}
</style>
<style id="pageStyle">@page{size:A4 portrait;margin:12mm}</style>
</head>
<body>
<div class="topbar">
  <img class="logo" id="topLogo" alt="Logo">
  <div class="tt">
    <b>Xafiiska Waxbarashada Dowlad-Goboleedka Soomaalida</b>
    <span>Somali Regional State Education Bureau · Tababarka &amp; Shahaadaynta Macallimiinta</span>
  </div>
  <div class="actions">
    <button class="langbtn" id="langBtn" onclick="toggleLang()">English</button>
    <button class="iconbtn noprint" id="homeBtn" onclick="go('home')">Hoyga</button>
    <button class="iconbtn noprint" id="toolNav" onclick="go('toolkit')">Qalabka</button>
    <button class="iconbtn noprint" id="verifyNav" onclick="go('verify')">Xaqiiji</button>
    <button class="iconbtn noprint" id="adminNav" onclick="go('admin')">Maamul</button>
  </div>
</div>

<div id="app"></div>
<div class="footer noprint" id="footer"></div>
<div class="toast" id="toast"></div>

  /**

  {q:"Macallinka wax ku oolka ah wuxuu:",o:["Sii wadaa barashadiisa nolosha oo dhan","Joojiyaa barashada markuu shahaado helo","Diidaa talooyinka asxaabta","Sanad kasta si isku mid ah wax u dhigaa"],a:0,s:"Xirfadluhu weligii wuu sii baranayaa."},

/* ------------------------------------------------------------ 2 */
{
 id:2, icon:"\u{1F4A1}",
 title:"Hababka iyo Farsamooyinka Waxbaridda",
 en:"Teaching Methods and Techniques",
 intro:"Cutubkan wuxuu ku barayaa mabaadi'da waxbaridda, barashada firfircoon, su'aal weydiinta wanaagsan iyo qalabka deegaanka laga helo.",
 why:"Ardaydu waxay wax ku bartaan samayn iyo fikir, maaha dhagaysi keliya. Hab wanaagsan ayaa fasal dhan barasho geliya.",
 goals:[
  "Ku dhaqan mabaadi'da waxbaridda casharkaaga.",
  "Isticmaal hababka barashada firfircoon.",
  "Weydii su'aalo fikir kiciya oo arday kasta ka qayb geli.",
  "Ka samee qalab waxbarid agabka deegaanka."
 ],
 lessons:[
  {t:"Mabaadi'da waxbaridda",
   idea:"Mabaadi'du waa xeerar fudud oo casharka ka dhiga mid la fahmi karo.",
   points:[
    "<b>Ka bilow waxa ay yaqaanaan:</b> xasuusi casharkii hore ama noloshooda.",
    "<b>Fudud ilaa adag:</b> tallaabo tallaabo u soco.",
    "<b>La taaban karo ilaa fikrad:</b> marka hore shay tus, kadib fikradda sharax.",
    "<b>Nolosha dhabta ah ku xiriiri:</b> tusaale deegaanka ka keen.",
    "<b>Ku celceli:</b> barashadu waxay ku xoogaysataa tababar."
   ],
   eg:"Casharka isku-darka fasalka 1aad: macallinku wuxuu ku bilaabay 3 riyood + 2 riyood oo lagu sawiray sabuuradda, kadib ayuu u gudbay tirooyinka 3 + 2 = 5.",
   tr:"Casharkaaga xiga ku bilow su'aal ku saabsan nolosha ardayda: <i>“Yaa guriga ku leh riyo? Imisa?”</i>"},
  {t:"Barashada firfircoon",
   idea:"Barashada firfircoon (active learning) waa marka ardaydu <b>sameeyaan, ka hadlaan, oo ka fikiraan</b> casharka.",
   points:[
    "<i>Waan maqlay, waan illaabay. Waan arkay, waan xasuustay. Waan sameeyay, waan fahmay.</i>",
    "Sharraxaaddaada ka dhig mid gaaban (10 daqiiqo ama ka yar).",
    "Arday kasta sii hawl uu qabto: qor, xisaabi, sawir, kala saar, ka hadal.",
    "Isticmaal <b>Fikir – Lammaane – La wadaag</b>: keligaa ka fikir, lammaanahaaga la hadal, kadib fasalka la wadaag."
   ],
   eg:"Fasal 75 arday ah oo Gunagado ku yaal: macallinku su'aal buu weydiiyay, 1 daqiiqo ayay keligood ka fikireen, 2 daqiiqo lammaane ahaan ayay ka wada hadleen. Dhammaan ardaydu way ka qayb qaateen.",
   tr:"Berri hal mar isticmaal Fikir – Lammaane – La wadaag."},
  {t:"Hababka muhiimka ah",
   idea:"Hal hab kuma filna. Isku beddel hababka si casharku u noqdo mid xiiso leh.",
   points:[
    "<b>Sharraxaad gaaban:</b> fikrad cusub marka la soo bandhigayo.",
    "<b>Su'aal iyo jawaab:</b> fikirka kicin iyo hubinta fahamka.",
    "<b>Shaqo koox:</b> 4–6 arday, arday kastana door leeyahay (hoggaamiye, qore, warbixiye).",
    "<b>Bandhig iyo tijaabo:</b> ardaydu indhahooda ayay ku arkaan.",
    "<b>Sheeko iyo door-ciyaar:</b> casharka ayay ka dhigaan mid la xasuusto.",
    "<b>Ciyaar waxbarasho:</b> ku celcelinta ayay ka dhigtaa mid xiiso leh."
   ],
   eg:"Casharka suuqa iyo lacagta: ardaydu waxay sameeyeen suuq yar oo fasalka ah: qaar ayaa iibiyay, qaarna way iibsadeen, waxayna xisaabiyeen lacagta.",
   tr:"Toddobaadkan ku dar hal hab oo aadan hore u isticmaalin."},
  {t:"Farsamada su'aal weydiinta",
   idea:"Su'aal wanaagsan waxay kicisaa fikirka. Su'aal xun waxay keenaysaa xifdin keliya.",
   points:[
    "<b>Su'aal xiran:</b> hal jawaab ayay leedahay (<i>“Imisa waa 4+3?”</i>).",
    "<b>Su'aal furan:</b> fikir ayay u baahan tahay (<i>“Sidee ku ogaatay?”, “Maxay sidaas u dhacday?”</i>).",
    "Kadib su'aasha, <b>sug 3–5 ilbiriqsi</b> intaadan cid dooran.",
    "Weydii arday kala duwan, ha weydiin kuwa gacmaha taagaya oo keliya.",
    "Jawaabta qaladka ah: ammaan isku dayga, si naxariis lehna u saxo."
   ],
   eg:"Macallimad Faadumo waxay magacyada ardayda ku qortaa ulo yaryar oo koob ku jira. Su'aal kasta hal ul ayay soo saartaa, sidaas ayuuna arday kastaa u helaa fursad uu ku jawaabo.",
   tr:"Berri ku tababar sugidda 3–5 ilbiriqsi kadib su'aal kasta."},
  {t:"Qalab waxbarid oo deegaanka laga helo",
   idea:"Lacag uma baahnid. Deegaankaaga waxaa ku jira qalab waxbarid oo fiican.",
   points:[
    "<b>Xisaab:</b> dhagxaan, ulo, furaha dhalooyinka, abuur, iniinyo.",
    "<b>Akhris:</b> kaararka xarfaha oo kartoon laga sameeyay, sheekooyinka bulshada.",
    "<b>Saynis:</b> caleemo, biyo, ciid, dhagax, xayawaanka deegaanka.",
    "<b>Juqraafi:</b> khariidad ciidda lagu sawiro, tusaalooyinka webiga Faafan iyo tuulooyinka.",
    "Ardayda ka dhig kuwo kaa caawiya ururinta qalabka."
   ],
   eg:"Dugsi ku yaal Dig ayaa ardaydu keeneen furaha dhalooyinka. Macallinku wuxuu u kala qaybiyay boqol iyo toban-toban, isku-darka iyo kala-goynta ayayna ku barteen.",
   tr:"Ardaydaada ka codso inay berri keenaan 10 dhagax ama 10 fure oo dhalo."}
 ],
 remember:[
  "Ka bilow waxa ay yaqaanaan, fudud ilaa adag.",
  "Ardaydu ha sameeyaan, ha ka hadlaan, ha ka fikiraan.",
  "Su'aal furan weydii, kadibna sug 3–5 ilbiriqsi.",
  "Qalabka deegaanka ayaa ah qalab waxbarid oo fiican."
 ],
 activity:"Dooro hal cashar oo aad toddobaadkan dhigi doonto. (1) Qor hal su'aal furan. (2) Qor hal hawl ardaydu qabanayaan. (3) Qor qalabka deegaanka ee aad isticmaali doonto.",
 questions:[
  {q:"Mabda'a 'ka bilow waxa ay yaqaanaan' macnihiisu waa:",o:["Ka bilow aqoonta hore ee ardayda","Ka bilow cutubka ugu adag","Ka bilow imtixaan","Ka bilow ciqaab"],a:0,s:"Aqoonta cusub waxay ku dhisantaa aqoonta hore."},
  {q:"Habka saxda ah ee casharka loogu dhex socdo waa:",o:["Fudud ilaa adag","Adag ilaa fudud","Kala daadsan","Dhammaadka ilaa bilowga"],a:0,s:"Tallaabo tallaabo ayaa barashadu u socotaa."},
  {q:"Barashada firfircoon waa marka ardaydu:",o:["Sameeyaan, ka hadlaan, oo ka fikiraan","Aamusaan oo dhagaystaan oo keliya","Sabuuradda ka qoraan oo keliya","Fasalka ka baxaan"],a:0,s:"Samaynta iyo fikirka ayaa barashada qoto dheer keena."},
  {q:"'Waan sameeyay, waanan fahmay' waxay muujinaysaa muhiimadda:",o:["Samaynta","Aamusnaanta","Xifdinta","Imtixaanka"],a:0,s:"Waxa aan gacmaheenna ku samayno ayaan si fiican u fahamnaa."},
  {q:"Kee baa ah su'aal furan?",o:["Sidee ku ogaatay jawaabta?","Ma 5 baa?","Haa mise maya?","Waa 3 mise 4?"],a:0,s:"Su'aasha furan waxay u baahan tahay fikir iyo sharraxaad."},
  {q:"Kadib markaad su'aal weydiiso, waa inaad sugtaa:",o:["3–5 ilbiriqsi","0 ilbiriqsi","5 daqiiqo","Sugid ma jirto"],a:0,s:"Sugiddu waxay arday kasta siisaa waqti uu ku fikiro."},
  {q:"Si arday kasta uga qayb qaato, macallinku waa inuu:",o:["Weydiiyaa arday kala duwan, kuwa aamusanna ku daraa","Weydiiyaa kuwa gacmaha taagaya oo keliya","Weydiiyaa ardayga ugu caqliga badan oo keliya","Cidna weydiin"],a:0,s:"Arday kasta wuxuu xaq u leeyahay inuu ka qayb qaato."},
  {q:"'Fikir – Lammaane – La wadaag' waa:",o:["Keligaa ka fikir, lammaanahaaga la hadal, kadib fasalka la wadaag","Macallinka oo akhriya","Ciyaar aan ujeeddo lahayn","Imtixaan qoraal ah"],a:0,s:"Habkani wuxuu fasal dhan ka dhigaa mid fikiraya."},
  {q:"Qalab waxbarid oo jaban oo deegaanka laga helo waa:",o:["Dhagxaan, ulo iyo furaha dhalooyinka","Kombiyuutar qaali ah","Buug dibadda laga keenay","Mashiin"],a:0,s:"Qalabka deegaanka waa bilaash, waana wax ku ool."},
  {q:"Sharraxaadda macallinku waa inay ahaataa:",o:["Gaaban oo cad, kadibna hawl ardaydu qabtaan","Saacad dhan","Mid aan tusaale lahayn","Luqad adag"],a:0,s:"Ardaydu waxay u baahan yihiin waqti ay ku dhaqmaan waxay barteen."},
  {q:"Tusaalaha nolosha dhabta ah wuxuu ardayda ka caawiyaa inay:",o:["Casharka la xiriiriyaan noloshooda","Daalaan","Illaawaan","Seexdaan"],a:0,s:"Markuu casharku nolosha la xiriiro wuu sii xasuusnaadaa."},
  {q:"Marka arday jawaab qalad ah bixiyo, macallinku waa inuu:",o:["Ammaanaa isku daygiisa oo si naxariis leh u saxaa","Ku qoslaa","Ciqaabaa","Iska indha tiraa"],a:0,s:"Ardaygu wuu sii isku dayaa marka uusan ka baqin khaladka."},
  {q:"Shaqada kooxda waxay ugu fiican tahay marka:",o:["Arday kasta door leeyahay","Hal arday shaqada oo dhan qabto","Aan hawl cad la bixin","Waqti la'aan"],a:0,s:"Doorarku waxay hubiyaan in arday kasta shaqeeyo."},
  {q:"Door-ciyaarka iyo sheekadu waxay:",o:["Casharka ka dhigaan mid xiiso leh oo la xasuusto","Lumiyaan waqtiga","Loogu talagalay carruurta yaryar oo keliya","Khalad yihiin"],a:0,s:"Sheekadu waxay casharka ku dhejisaa maskaxda."},
  {q:"Ku celcelintu (tababarku):",o:["Waxay xoojisaa barashada","Faa'iido ma leh","Waxay daalisaa ardayda oo keliya","Loogu talagalay imtixaanka oo keliya"],a:0,s:"Tababarka joogtada ah ayaa xirfadda xoojiya."}

{
 id:3, icon:"\u{1F3EB}",
 title:"Maaraynta iyo Habaynta Fasalka",
 en:"Classroom Management",
 intro:"Cutubkan wuxuu ku barayaa sida loo abuuro fasal nabdoon oo nidaamsan, anshaxa togan, iyo maaraynta fasallada waaweyn iyo kuwa fasallada-badan.",
 why:"Barashadu kama dhacdo fasal buuq iyo cabsi leh. Fasal nidaamsan ayaa waqtiga barashada kordhiya.",
 goals:[
  "Abuur jawi fasal oo nabdoon oo soo dhaweyn leh.",
  "La samee ardayda xeerar iyo nidaam maalinle ah.",
  "Isticmaal anshaxa togan halkii ciqaab.",
  "Maaree fasal weyn iyo fasal fasallo-badan."
 ],
 lessons:[
  {t:"Jawi fasal oo nabdoon",
   idea:"Ardaygu wuxuu wax bartaa marka uu dareemo <b>nabadgelyo, ixtiraam iyo soo dhaweyn</b>.",
   points:[
    "Ardayda ku salaan albaabka, magacyadoodana ku yeedh.",
    "Fasalka ka dhig mid nadiif ah oo ay ka muuqato shaqada ardayda.",
    "Fadhiga u habee si aad arday kasta u aragto.",
    "Qosol iyo naxariis: cabsi kuma jiro barasho wanaagsan."
   ],
   eg:"Macallin Axmed (Daroor) wuxuu derbiga ku dhejiyaa sawirrada iyo qoraallada ardayda. Ardaydu waxay dareemaan in fasalku yahay kooda.",
   tr:"Berri ardayda albaabka ku soo dhaweey, mid kastana magaciisa ku salaan."},
  {t:"Xeerarka iyo nidaamka maalinlaha ah",
   idea:"Xeerar yar oo cad iyo nidaam joogto ah ayaa buuqa yareeya oo waqtiga badbaadiya.",
   points:[
    "La samee ardayda <b>3–5 xeer</b> oo keliya.",
    "Si togan u qor: <i>“Gacanta taag markaad hadlayso”</i>, halkii <i>“Ha qaylin”</i>.",
    "Xeerarka ku dheji derbiga, toddobaadka koowaadna ku celceli.",
    "Nidaam u samee: gelitaanka, qaybinta buugaagta, shaqo koox, iyo ka bixitaanka."
   ],
   eg:"Xeerarka fasalka 5aad ee Yocaale: (1) Waqtiga imow. (2) Gacanta taag. (3) Dhagayso qofka hadlaya. (4) Is-caawi. (5) Fasalka nadiifi.",
   tr:"Maanta ardaydaada la samee 3–5 xeer oo togan, kuna qor waraaq weyn."},
  {t:"Anshaxa togan",
   idea:"Anshaxa togan (positive discipline) wuxuu baraa dabeecad wanaagsan, <b>garaacis iyo cay la'aan</b>.",
   points:[
    "<b>Ammaan</b> dabeecadda wanaagsan si gaar ah: <i>“Cali, waad ku mahadsan tahay inaad sugtay.”</i>",
    "Marka dhibaato dhacdo, marka hore <b>fahan sababta</b> (gaajo, xanuun, cabsi, ma fahmin).",
    "Isticmaal <b>cawaaqib macquul ah</b>: dib u samee shaqada, la hadal ardayga, fadhi beddel.",
    "Si deggan ula hadal ardayga, keligiisna la hadal, fasalka hortiisa ha ku ceebayn."
   ],
   eg:"Arday ayaa had iyo jeer daaha. Macallinku ma ciqaabin. Wuxuu ogaaday inuu subaxdii xoolaha raaco. Waalidka ayuu la hadlay, waxayna heshiiyeen inuu xoogaa ka hor yimaado.",
   tr:"Berri u fiirso 5 arday oo samaynaya dabeecad wanaagsan, si gaar ahna u ammaan."},
  {t:"Fasallada waaweyn iyo kuwa fasallada-badan",
   idea:"Fasal 70+ arday ah ama fasal leh laba fasal ayaa la maarayn karaa haddii la isticmaalo <b>kooxo iyo arday is-caawiya</b>.",
   points:[
    "Ardayda u qaybi kooxo 5–6 ah, koox kastana hoggaamiye u dooro.",
    "<b>Arday-u-bare-arday:</b> ardayga hore u maray ha caawiyo ardayga kale.",
    "Fasallada-badan: koox wax ha la baro adiga, kooxda kalena hawl qoraal ah ha qabato, kadib isku beddel.",
    "Isticmaal calaamado fudud: gacan kor u qaadis = aamus oo i dhagayso."
   ],
   eg:"Dugsi yar oo miyiga Jarar ku yaal, hal macallin ayaa dhiga fasalka 2aad iyo 3aad. Inta uu fasalka 2aad akhris barayo, fasalka 3aad waxay xalliyaan xisaab uu sabuuradda ku qoray.",
   tr:"Fasalkaaga u qaybi kooxo, kooxda kastana u magacow hoggaamiye."},
  {t:"Maaraynta waqtiga fasalka",
   idea:"Daqiiqad kasta oo lumata waa barasho lumatay. Ilaali <b>waqtiga barashada</b>.",
   points:[
    "Casharka ku bilow waqtigiisa, qalabkana hore u diyaari.",
    "Hawl kasta waqti u qabo, ardaydana u sheeg (<i>“5 daqiiqo ayaad haysataan”</i>).",
    "Fasalka dhex mar inta ardaydu shaqaynayaan, caawimona bixi.",
    "Dhammaadka casharka 3–5 daqiiqo u hayso soo koobid."
   ],
   eg:"Macallimad Sahra waxay sabuuradda dhinaceeda ku qortaa qorshaha casharka iyo waqtiga hawl kasta. Ardaydu way ogyihiin waxa xiga.",
   tr:"Casharkaaga xiga, hawl kasta waqti u qabo kuna qor sabuuradda dhinaceeda."}
 ],
 remember:[
  "Soo dhaweyn, magac ku yeedhid iyo naxariis.",
  "3–5 xeer oo togan oo lala sameeyay ardayda.",
  "Anshaxa togan: ammaan, fahan sababta, cawaaqib macquul ah.",
  "Kooxo iyo arday is-caawiya ayaa fasalka weyn maareeya."
 ],
 activity:"Qor xeerarka fasalkaaga (3–5). Ka dibna qor sida aad u maarayn doonto arday had iyo jeer hadla inta aad sharxayso, adigoon ciqaab isticmaalin.",
 questions:[
  {q:"Jawi fasal oo wanaagsan wuxuu ku bilowdaa:",o:["Salaan iyo soo dhaweyn diirran","Qaylo","Ciqaab","Aamusnaan cabsi leh"],a:0,s:"Ardaygu wuxuu wax bartaa marka uu nabad dareemo."},
  {q:"Xeerarka fasalku waa inay ahaadaan:",o:["3–5 xeer oo cad oo lala sameeyay ardayda","30 xeer","Kuwo aan la qorin","Kuwo maalin kasta isbeddela"],a:0,s:"Xeerar yar oo cad ayaa la xasuustaa oo lagu dhaqmaa."},
  {q:"Kee baa ah xeer si togan u qoran?",o:["Gacanta taag markaad hadlayso","Ha qaylin","Ha ordin","Ha la hadlin saaxiibkaa"],a:0,s:"Xeerka togan wuxuu sheegaa waxa la sameynayo."},
  {q:"Anshaxa togan waa:",o:["Ammaanta dabeecadda wanaagsan iyo cawaaqib macquul ah","Garaacis","Cay","Maalin kasta ardayda fasalka laga saaro"],a:0,s:"Anshaxa togan wuxuu baraa dabeecad, ma dhaawaco."},
  {q:"Marka arday dhibaato sameeyo, tallaabada ugu horreysa waa:",o:["Fahan sababta","Garaac","Fasalka ka saar","Weligaa iska indha tir"],a:0,s:"Sababta (gaajo, cabsi, ma fahmin) ayaa xalka tilmaamaysa."},

  {q:"Fasal weyn (70+ arday) waxaa lagu maarayn karaa:",o:["Kooxo leh hoggaamiyeyaal","Macallinka oo keliya hadla","Ka tegid","Ciqaab"],a:0,s:"Kooxuhu waxay arday kasta siiyaan fursad uu ku shaqeeyo."},

  {q:"Macallinka fasalka dhex socda inta ardaydu shaqaynayaan wuxuu:",o:["La socdaa barashada oo caawimo bixiyaa","Waqti lumiyaa","Ardayda cabsi geliyaa","Ka fogaadaa ardayda"],a:0,s:"Dhex-socodku wuxuu kuu suurtageliyaa inaad aragto cidda u baahan caawimo."},

{
 id:4, icon:"\u{1F4DD}",
 title:"Qorsheynta Casharka iyo Micro-teaching",
 en:"Lesson Planning and Micro-teaching",
 intro:"Cutubkan wuxuu ku barayaa sida loo qoro yoolal cad, sida loo dhiso cashar 5 tallaabo ah, iyo sida loogu tababarto micro-teaching.",
 why:"Macallin qorshe wata waa macallin kalsooni leh. Qorshuhu wuxuu hubiyaa in waqtiga fasalka loo isticmaalo barasho.",
 goals:[
  "Qor yoolal cad oo la qiyaasi karo.",
  "Dhis cashar leh 5 tallaabo.",
  "Diyaari cashar gaaban oo micro-teaching ah.",
  "Bixi oo qaado jawaab-celin wax ku ool ah."
 ],
 lessons:[
  {t:"Sababta qorshuhu muhiim u yahay",
   idea:"Qorshaha casharku waa khariidadda macallinka: <b>halkee ayaan u socdaa, sideese ku gaarayaa?</b>",
   points:[
    "Wuxuu kuu caddeeyaa waxa ardaydu baranayaan.",
    "Wuxuu kaa caawiyaa inaad qalabka iyo hawlaha hore u diyaariso.",
    "Wuxuu ilaaliyaa waqtiga fasalka.",
    "Wuxuu ku xiran yahay <b>manhajka</b> iyo <b>heerka ardaydaada</b>."
   ],
   eg:"Macallin Ibraahim (Araarso) wuxuu qorshaha toddobaadka qoraa maalinta Axadda. Isniinta ilaa Khamiista, fasalka wuxuu u galaa isagoo diyaar ah.",
   tr:"Qor qorshaha casharkaaga berri adigoo isticmaalaya foomka ku jira Qalabka Macallinka."},
  {t:"Yoolal cad",
   idea:"Yoolku wuxuu sheegaa <b>waxa ardaygu awoodi doono dhammaadka casharka</b>.",
   points:[
    "Ku bilow: <i>“Dhammaadka casharka, ardaydu waxay awoodi doonaan inay…”</i>",
    "Isticmaal <b>fal la arki karo</b>: sheeg, qor, xisaabi, kala saar, sawir, sharax.",
    "Ka fogow falal aan la arki karin sida <i>“fahan”</i> ama <i>“ogow”</i> oo keliya.",
    "Ku dar heerka: <i>“8 ka mid ah 10 su'aalood si sax ah”</i>."
   ],
   eg:"Yool liita: <i>“Ardaydu waxay fahmi doonaan isku-darka.”</i><br>Yool fiican: <i>“Ardaydu waxay isku dari doonaan laba tiro oo laba god ah, 8 ka mid ah 10 si sax ah.”</i>",
   tr:"Dib u qor yoolka casharkaaga xiga adigoo isticmaalaya fal la arki karo."},
  {t:"Casharka 5 tallaabo",
   idea:"Cashar 40 daqiiqo ah waxaa loo qaybin karaa <b>5 tallaabo</b>:",
   points:[
    "<b>1. Hordhac (5 daq):</b> xiiso kici, xasuusi casharkii hore, sheeg yoolka.",
    "<b>2. Sharraxaad / Bandhig (10 daq):</b> fikradda cusub ku tus tusaale.",
    "<b>3. Tababar la hagay (10 daq):</b> ardaydu adiga ayay kula shaqeeyaan.",
    "<b>4. Tababar shakhsi / koox (10 daq):</b> ardaydu keligood ama kooxo ayay u shaqeeyaan.",
    "<b>5. Soo koobid iyo hubin (5 daq):</b> su'aalo gaaban, kaarka ka bixitaanka, shaqo guri."
   ],
   eg:"Xisaab fasalka 3aad (isku-darka): (1) Sheeko suuq. (2) Furayaal dhalo ku tus 23 + 14. (3) Wada xalliya 3 tusaale. (4) Kooxuhu ha xalliyaan 5 su'aalood. (5) Arday kasta 2 su'aalood ha ku qoro waraaq.",
   tr:"Casharkaaga xiga u qaybi 5-tan tallaabo, tallaabo kastana waqtigeeda ku qor."},
  {t:"Diyaarinta qalabka iyo shaqada guriga",
   idea:"Qalabka iyo shaqada guriga waa qayb ka mid ah qorshaha, maaha wax dambe.",
   points:[
    "Qalabka diyaari <b>ka hor casharka</b>, ha ku raadin fasalka dhexdiisa.",
    "Hubi in qalabku ku filan yahay kooxaha oo dhan.",
    "Shaqada guriga ka dhig mid <b>gaaban, cad oo casharka la xiriirta</b>.",
    "Shaqada guriga hubi oo jawaab-celin ka bixi."
   ],
   eg:"Macallimad Ayaan waxay kartoon ka samaysay 30 kaar oo xarfo ah. Sanado badan ayay isticmaashay.",
   tr:"Samee hal qalab waxbarid oo aad sanadka oo dhan isticmaali karto."},
  {t:"Micro-teaching iyo jawaab-celin",
   idea:"Micro-teaching waa <b>cashar gaaban (5–10 daqiiqo)</b> oo aad asxaabtaada hortooda kaga tababarto, si aad u hagaajiso xirfad gaar ah.",
   points:[
    "Dooro hal xirfad: su'aal weydiin, hordhac, isticmaalka sabuuradda, soo koobid.",
    "Asxaabtaadu waxay noqdaan ardayda, kadibna jawaab-celin ayay ku siiyaan.",
    "Jawaab-celinta: <b>Laba xiddigood iyo hal rajo</b> (2 wax oo wanaagsan + 1 talo).",
    "Dib u bar casharka adigoo isticmaalaya talada. Taasi waa horumar!"
   ],
   eg:"Macallimiinta dugsiga Dhagaxbuur waxay micro-teaching sameeyaan maalinta Khamiista. Macallin kastaa 7 daqiiqo ayuu dhigaa, wuxuuna helaa 2 xiddigood iyo 1 rajo.",
   tr:"Weydiiso hal saaxiib inuu 10 daqiiqo daawado casharkaaga, una sheego 2 xiddigood iyo 1 rajo."}
 ],
 remember:[
  "Qorshuhu waa khariidadda casharka.",
  "Yool = fal la arki karo + heer.",
  "5 tallaabo: Hordhac, Sharraxaad, Tababar la hagay, Tababar shakhsi, Soo koobid.",
  "Micro-teaching: 2 xiddigood + 1 rajo, kadib dib u bar."
 ],
 activity:"Qor qorshe cashar oo dhammaystiran (40 daqiiqo) oo maaddadaada ah: yool, qalab, 5-ta tallaabo iyo waqtigooda, iyo sida aad u hubin doonto barashada.",
 questions:[
  {q:"Qorshaha casharku wuxuu macallinka ka caawiyaa:",o:["Inuu ogaado waxa uu barayo iyo sida uu u barayo","Inuu waqti lumiyo","Inuu fasalka ka maqnaado","Inuu buugga akhriyo oo keliya"],a:0,s:"Qorshuhu wuxuu caddeeyaa yoolka iyo habka."},
  {q:"Kee baa ah yool cad oo la qiyaasi karo?",o:["Ardaydu waxay isku dari doonaan laba tiro oo laba god ah, 8 ka mid ah 10 si sax ah","Ardaydu waxay fahmi doonaan xisaabta","Ardaydu way baran doonaan","Casharka waa la dhammayn doonaa"],a:0,s:"Wuxuu leeyahay fal la arki karo iyo heer la cabbiri karo."},
  {q:"Falka ugu fiican ee yoolka waa fal:",o:["La arki karo (qor, sheeg, xisaabi)","Aan la arki karin (fahan, ogow)","Aan jirin","Adag"],a:0,s:"Falka la arki karo ayaa kuu oggolaanaya inaad hubiso barashada."},
  {q:"Tallaabada koowaad ee casharku waa:",o:["Hordhac xiisa kiciya oo xasuusiya casharkii hore","Imtixaan","Shaqo guri","Soo koobid"],a:0,s:"Hordhacu wuxuu diyaariyaa maskaxda ardayga."},
  {q:"'Tababarka la hagay' waa marka:",o:["Ardaydu macallinka la shaqeeyaan isagoo caawinaya","Ardaydu keligood shaqeeyaan","Macallinku keligiis hadlo","Ciyaar"],a:0,s:"Macallinku wuu taageeraa ilaa ardaydu kalsooni ka helaan."},
  {q:"Dhammaadka casharka waa in la sameeyaa:",o:["Soo koobid iyo hubinta barashada","Cashar cusub","Ciqaab","Waxba"],a:0,s:"Soo koobiddu waxay xoojisaa barashada, waxayna muujisaa cidda baratay."},
  {q:"Micro-teaching waa:",o:["Cashar gaaban (5–10 daqiiqo) oo asxaab hortooda lagu tababarto","Imtixaan dhammaad","Fasal 80 arday ah","Shir waalid"],a:0,s:"Waa tababar ammaan ah oo xirfad gaar ah lagu hagaajiyo."},
  {q:"Jawaab-celinta 'Laba xiddigood iyo hal rajo' waa:",o:["2 wax oo wanaagsan iyo 1 talo horumarin","2 cay iyo 1 ammaan","Buundo","Ammaan keliya"],a:0,s:"Waxay isku dheellitirtaa dhiirigelinta iyo horumarinta."},
  {q:"Qalabka waxbaridda waa in la diyaariyaa:",o:["Ka hor casharka","Inta casharku socdo","Casharka kadib","Weligaa"],a:0,s:"Diyaarintu waxay badbaadisaa waqtiga fasalka."},
  {q:"Cashar 40 daqiiqo ah, qaybta ugu badan waa inay u tagtaa:",o:["Hawlaha iyo tababarka ardayda","Sheekada macallinka","Qorista sabuuradda","Sugitaan"],a:0,s:"Ardaydu waxay wax ku bartaan samaynta."},
  {q:"Qorshe wanaagsan wuxuu ku dhisan yahay:",o:["Manhajka iyo heerka ardayda","Rabitaanka macallinka oo keliya","Buug kasta oo la helo","Kala daadsanaan"],a:0,s:"Manhajku wuxuu sheegaa waxa la barayo; heerka ardayduna sida loo barayo."},
  {q:"Casharka kadib, macallinku waa inuu:",o:["Milicsadaa oo qoraa waxa shaqeeyay iyo waxa la beddelayo","Iska illaawaa","Ardayda eedeeyaa","Qorshaha tuuraa"],a:0,s:"Milicsigu wuxuu hagaajiyaa casharka xiga."},
  {q:"Hordhac wanaagsan wuxuu noqon karaa:",o:["Su'aal xiiso leh, sheeko gaaban ama shay la tuso","Akhrinta bogga oo dhan","Imtixaan","Aamusnaan"],a:0,s:"Hordhacu waa inuu xiisaha ardayda kiciyaa."},
  {q:"Haddii casharku si fiican u socon waayo, macallinku waa inuu:",o:["Qorshaha wax ka beddelaa oo hab kale isku dayaa","Ardayda eedeeyaa","Joojiyaa barista","Si isku mid ah ugu celiyaa"],a:0,s:"Macallinka xirfadlaha ahi wuu dabacsan yahay."},
  {q:"Shaqada gurigu waa inay ahaataa:",o:["Gaaban, cad oo casharka la xiriirta","Dheer oo adag","Mid aan la hubin","Ciqaab"],a:0,s:"Shaqada guriga ujeeddadeedu waa ku celcelin, maaha culays."}
 ]
},
/* ------------------------------------------------------------ 5 */
{
 id:5, icon:"\u{1F4CA}",
 title:"Qiimaynta Barashada",
 en:"Assessment of Learning",
 intro:"Cutubkan wuxuu ku barayaa noocyada qiimaynta, hababka fudud ee fasalka, jawaab-celinta wax ku oolka ah, iyo sida natiijooyinka loogu isticmaalo horumarinta ardayda.",
 why:"Qiimayntu waxay kuu sheegtaa cidda baratay iyo cidda u baahan caawimo. Iyada la'aanteed, macallinku wuxuu wax u dhigaa mugdi.",
 goals:[
  "Kala saar qiimaynta joogtada ah iyo qiimaynta dhammaadka.",
  "Isticmaal hababka qiimaynta fudud maalin kasta.",
  "Bixi jawaab-celin gaar ah oo horumarisa ardayga.",
  "Diyaari imtixaan caddaalad ah oo yoolalka la xiriira."
 ],
 lessons:[
  {t:"Noocyada qiimaynta",
   idea:"Qiimayntu waa <b>ururinta macluumaadka barashada ardayga</b> si loo horumariyo waxbaridda iyo barashada.",
   points:[
    "<b>Qiimaynta joogtada ah (formative):</b> inta barashadu socoto. Ujeeddadu waa hagaajin.",
    "<b>Qiimaynta dhammaadka (summative):</b> dhammaadka cutub ama sanad. Ujeeddadu waa cabbir.",
    "Labaduba waa muhiim, laakiin tan joogtada ah ayaa maalin kasta ardayda caawisa."
   ],
   eg:"Cunto karis: marka cuntadu dabka saaran tahay ee la dhadhamiyo waa qiimayn joogto ah. Marka martidu cunaan waa qiimayn dhammaad.",
   tr:"Casharkaaga xiga ku dar hal qiimayn joogto ah inta casharku socdo."},
  {t:"Hababka qiimaynta fudud",
   idea:"Qiimayntu uma baahna waraaqo badan. Waxaa jira habab fudud oo <b>daqiiqad gudaheed</b> ah.",
   points:[
    "<b>Suulka kor / hoos:</b> <i>“Ma fahanteen?”</i> Ardaydu suulka ayay kor ama hoos u qaadaan.",
    "<b>Kaarka ka bixitaanka:</b> dhammaadka casharka, 1–2 su'aalood oo waraaq yar lagu qoro.",
    "<b>Sabuurad yar / sleydh:</b> arday kasta jawaabta ha qoro oo kor ha u qaado.",
    "<b>Indho-indhayn:</b> dhex mar fasalka, eeg shaqada, qor qoraallo gaaban.",
    "<b>Su'aalo afka ah:</b> weydii arday kala duwan."
   ],
   eg:"Macallin Maxamed (Birqod) wuxuu ardayda siiyaa waraaq yar dhammaadka casharka. Su'aal keliya: <i>“Hal shay oo aad baratay maanta?”</i> Wuxuu ogaadaa cidda u baahan caawimo berri.",
   tr:"Berri isticmaal kaarka ka bixitaanka, kadibna ku kala sooc 3 kooxood: wuu fahmay, xoogaa ayuu fahmay, ma fahmin."},
  {t:"Jawaab-celin wax ku ool ah",
   idea:"Jawaab-celinta wanaagsan waxay ardayga u sheegtaa <b>meesha uu joogo iyo tallaabada xigta</b>.",
   points:[
    "<b>Gaar ah:</b> <i>“Xarfaha waad si fiican u qortay; hadda bilow jumlad kasta xaraf weyn.”</i>",
    "<b>Deg deg ah:</b> isla maalinta ama berrito, maaha bil kadib.",
    "<b>Togan oo tallaabo tilmaamaysa:</b> ammaan waxa fiican, kadib hal talo bixi.",
    "<i>“Fiican”</i> ama <i>“6/10”</i> oo keliya kuma filna; talo ku dar."
   ],
   eg:"Halkii uu buugga ku qori lahaa <i>“Khalad”</i>, macallinku wuxuu qoray: <i>“Isku-darka waa sax. Hubi in aad hal-halka marka hore isku darto.”</i>",
   tr:"Buugaagta 5 arday ku qor jawaab-celin gaar ah oo leh hal ammaan iyo hal talo."},
  {t:"Diyaarinta imtixaan wanaagsan",
   idea:"Imtixaanka wanaagsan wuxuu cabbiraa <b>waxa la baray</b>, si caddaalad ahna ardayda u qiimeeyaa.",
   points:[
    "Su'aal kasta ha la xiriirto <b>yool</b> casharrada ka mid ah.",
    "Isku dar heerar kala duwan: <b>xasuus</b>, <b>fahan</b>, iyo <b>adeegsi</b>.",
    "Tilmaamo cad iyo luqad fudud isticmaal.",
    "Waqti ku filan sii, arday kastana fursad siman sii."
   ],
   eg:"Saynis fasalka 6aad: Xasuus: <i>“Magacaw 3 qaybood oo dhirta ah.”</i> Fahan: <i>“Maxay dhirtu iftiin ugu baahan tahay?”</i> Adeegsi: <i>“Maxaa ku dhacaya geed qol mugdi ah la dhigo?”</i>",
   tr:"Imtixaankaaga xiga u qor 3 su'aalood oo kala ah xasuus, fahan iyo adeegsi."},
  {t:"Isticmaalka natiijooyinka",
   idea:"Natiijooyinku ma aha in la kaydiyo oo keliya. Waa in loo isticmaalo <b>go'aan waxbarid</b>.",
   points:[
    "Haddii ardayda badankood khaldameen, <b>dib u bar</b> qaybtaas adigoo hab kale isticmaalaya.",
    "Ardayda u kooxee heerkooda, si aad u siiso caawimo ku habboon.",
    "Diiwaan fudud hayso: magac, taariikh, natiijo, qoraal gaaban.",
    "Natiijooyinka la wadaag waalidiinta, ardaydana bar inay is-qiimeeyaan."
   ],
   eg:"Macallimad Khadra waxay aragtay in 20 arday ay ku khaldameen jajabka. Maalinta xigta waxay dib ugu bartay rooti iyo khariidad sawir leh. 16 ka mid ah ayaa fahmay.",
   tr:"Eeg natiijooyinka imtixaankii u dambeeyay. Dooro hal qayb oo ardayda badankood ku adkaatay, dibna u bar."}
 ],
 remember:[
  "Qiimaynta joogtada ah = hagaajin. Qiimaynta dhammaadka = cabbir.",
  "Habab fudud: suulka, kaarka ka bixitaanka, sabuurad yar, indho-indhayn.",
  "Jawaab-celin: gaar ah, deg deg ah, hal talo.",
  "Natiijooyinka u isticmaal inaad dib wax u barto oo ardayda caawiso."
 ],
 activity:"Qor 5 su'aalood oo imtixaan ah oo cutub aad dhigto ku saabsan: 2 xasuus, 2 fahan, 1 adeegsi. Kadib qor sida aad natiijooyinka ugu isticmaali doonto caawinta ardayda daciifka ah.",
 questions:[
  {q:"Qiimaynta joogtada ah (formative) waxay dhacdaa:",o:["Inta barashadu socoto si waxbaridda loo hagaajiyo","Dhammaadka sanadka oo keliya","Marna","Imtixaanka qaranka oo keliya"],a:0,s:"Waxay macallinka u sheegtaa waxa uu hadda beddelayo."},
  {q:"Qiimaynta dhammaadka (summative) waxay:",o:["Cabbirtaa barashada dhammaadka cutub ama sanad","Dhacdaa daqiiqad kasta","Aan qiimayn ahayn","Ciyaar keliya tahay"],a:0,s:"Waxay soo koobtaa waxa la bartay muddo kadib."},
  {q:"'Kaarka ka bixitaanka' (exit ticket) waa:",o:["Su'aal gaaban oo ardaydu ka jawaabaan dhammaadka casharka","Tigidh baska","Shaqo guri dheer","Ciqaab"],a:0,s:"Wuxuu si deg deg ah u muujiyaa cidda fahantay."},
  {q:"Jawaab-celinta wax ku oolka ahi waa:",o:["Gaar ah, deg deg ah oo tilmaamaysa tallaabada xigta","'Fiican' oo keliya","Buundo keliya","Mid bil kadib la bixiyo"],a:0,s:"Ardaygu wuxuu ogaadaa waxa uu sii wado iyo waxa uu hagaajiyo."},
  {q:"Su'aalaha imtixaanku waa inay la xiriiraan:",o:["Yoolalka casharka","Waxa aan la barin","Su'aalo khiyaano ah","Maaddooyin kale"],a:0,s:"Imtixaanku wuxuu cabbiraa waxa la baray."},
  {q:"Imtixaanka wanaagsan wuxuu leeyahay su'aalo heerar kala duwan ah:",o:["Xasuus, fahan iyo adeegsi","Xasuus oo keliya","Adeegsi oo keliya","Hal heer"],a:0,s:"Heerarku waxay muujiyaan qoto dheeraanta barashada."},
  {q:"Ujeeddada ugu weyn ee qiimayntu waa:",o:["In barashada la horumariyo","In ardayda la cabsi geliyo","In ardayda la kala sooco oo keliya","In waqti la buuxiyo"],a:0,s:"Qiimayntu waa qalab barasho, maaha qalab cabsi."},
  {q:"Marka ardayda badankood su'aal ku khaldamaan, macallinku waa inuu:",o:["Qaybtaas dib u baro hab kale","Sii socdo","Ardayda eedeeyo","Su'aasha iska tuuro"],a:0,s:"Khaladka badan wuxuu muujinayaa in habka waxbaridda la beddelo."},
  {q:"Indho-indhayntu (observation) waa:",o:["Ardayda la eego inta ay shaqaynayaan, waxna la qoro","Hurdo","Imtixaan qoraal ah oo keliya","Ciyaar"],a:0,s:"Waxay muujisaa xirfadaha aan imtixaan qoraal ah lagu arki karin."},
  {q:"Diiwaanka natiijooyinka ardaygu wuxuu caawiyaa:",o:["La socodka horumarka iyo la wadaagga waalidka","Waqti lumis","Maamulaha oo keliya","Ciqaab"],a:0,s:"Diiwaanku wuxuu muujiyaa horumarka muddo kadib."},
  {q:"Suulka kor / hoos wuxuu macallinka ka caawiyaa:",o:["Inuu si deg deg ah u ogaado heerka fahamka","Inuu ciyaaro","Inuu ardayda caayo","Waxba ma taro"],a:0,s:"Hab ilbiriqsiyo qaata oo fasalka oo dhan ka warbixiya."},
  {q:"Is-qiimaynta ardaygu waxay:",o:["Ardayga baraysaa inuu ogaado heerkiisa","Khalad tahay","Waqti lumis tahay","Loogu talagalay macallinka oo keliya"],a:0,s:"Ardayga is-qiimeeya wuxuu noqdaa barte madax-bannaan."},
  {q:"Imtixaanku waa inuu caddaalad noqdaa, macnaha:",o:["Arday kasta fursad siman buu helaa, tilmaamuhuna way cad yihiin","Qaar ayaa jawaabaha la siiyaa","Luqad aan la fahmin","Waqti aan ku filnayn"],a:0,s:"Caddaaladdu waxay hubisaa in natiijadu run tahay."},
  {q:"Buundada keliya ('6/10') waxaa ka maqan:",o:["Talo ku saabsan sida loo horumaro","Tiro","Taariikh","Magac"],a:0,s:"Ardaygu wuxuu u baahan yahay inuu ogaado sida uu u horumaro."},
  {q:"Natiijooyinka qiimaynta waxaa loo isticmaalaa in:",o:["Ardayda la kooxeeyo, caawimona loo qorsheeyo","Ardayda la ceebeeyo","La qariyo","La illaawo"],a:0,s:"Natiijooyinku waxay hagaan go'aannada waxbaridda."}
 ]
},
/* ------------------------------------------------------------ 6 */
{
 id:6, icon:"\u{1F331}",
 title:"Guusha Arday Kasta",
 en:"Every Student Succeeds",
 intro:"Cutubkan cusub wuxuu ku barayaa sida arday kasta loogu horseedo guul: maskax koraysa, waxbarid kala duwan, ardayda u baahan taageero gaar ah, akhriska iyo xisaabta aasaasiga ah, iyo ka hortagga ka-tegidda dugsiga.",
 why:"Fasal kasta waxaa ku jira arday kala duwan. Macallinka xirfadlaha ahi ma dayaco cidna: arday kasta wuxuu u helaa waddo uu ku guuleysto.",
 goals:[
  "Ardayda ku dhis maskax koraysa iyo kalsooni.",
  "U habee hawlaha heerarka kala duwan ee ardayda.",
  "Taageer ardayda u baahan caawimo gaar ah, gabdhaha iyo carruurta xoolo-dhaqatada ah.",
  "Xoogee akhriska iyo xisaabta aasaasiga ah, kana hortag ka-tegidda dugsiga."
 ],
 lessons:[
  {t:"Arday kasta wuu baran karaa",
   idea:"<b>Maskaxdu way koraysaa</b> marka la dadaalo. Caqligu maaha mid go'an; arday kasta wuu horumari karaa.",
   points:[
    "Ammaan <b>dadaalka iyo habka</b>, maaha caqliga oo keliya: <i>“Waad ku dadaashay, sidaas ayaad ku xalisay.”</i>",
    "Isticmaal ereyga <b>“weli”</b>: <i>“Weli ma aadan baran, laakiin waad baran doontaa.”</i>",
    "Khaladku waa qayb ka mid ah barashada; ha ka dhigin ceeb.",
    "Ardayda u sheeg inaad rumaysan tahay inay awoodaan."
   ],
   eg:"Arday la odhan jiray <i>“ma garanayo xisaabta”</i>, macallimad ayaa maalin kasta 5 daqiiqo la shaqeysay oo dadaalkiisa ammaantay. Seddex bilood kadib wuxuu ka mid noqday kuwa ugu fiican kooxdiisa.",
   tr:"Berri isticmaal ereyga “weli” ugu yaraan saddex jeer."},
  {t:"Waxbarid kala duwan",
   idea:"Ardaydu isku heer ma aha. <b>Waxbarid kala duwan</b> (differentiation) waa in hawlaha loo habeeyo heerarkooda.",
   points:[
    "Diyaari <b>hawl 3 heer ah</b>: fudud, dhexe, iyo adag. Isku yool, kala heer.",
    "Ardayda daciifka ah: tusaale dheeraad ah, qalab la taaban karo, waqti dheeraad ah.",
    "Ardayda hore u maray: su'aalo fikir dheer u baahan, ha caawiyaan kuwa kale.",
    "Isticmaal habab kala duwan: arag (sawir), maqal (sheeko), samee (gacmaha)."
   ],
   eg:"Casharka isku-darka: kooxda A waxay isku daraan tirooyin hal god ah iyagoo dhagxaan isticmaalaya, kooxda B laba god, kooxda C waxay qoraan masalooyin sheeko ah.",

  try{const r=localStorage.getItem(OLDKEY);if(!r)return null;const o=JSON.parse(r);
    const d=freshDB();d.teachers=o.teachers||[];d.certificates=o.certificates||[];d.certSeq=o.certSeq||0;
    if(o.settings&&o.settings.adminPass)d.settings.adminPass=o.settings.adminPass;
    return d;}catch(e){return null;}
}
function loadDB(){try{const r=localStorage.getItem(DBKEY);
  if(!r)return migrateV1()||freshDB();
  const d=JSON.parse(r);d.settings=Object.assign({},defaultSettings,d.settings||{});
  d.customQuestions=Object.assign(emptyCustom(),d.customQuestions||{});
  return d;}catch(e){return freshDB();}}
function saveDB(){try{const c=Object.assign({},DB);delete c._adminOK;localStorage.setItem(DBKEY,JSON.stringify(c));}catch(e){
  toast(t("Could not save. Storage may be full or blocked.","Lama kaydin karo. Kaydku wuu buuxsamay ama waa xannibanyahay."));}}
let DB = loadDB();
let LANG = DB.lang || "so";

/* ---- helpers ---- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
function t(en,so){return LANG==="so"?so:en;}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,Math.min(n,a.length));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2800);}
function pad(n,l){return String(n).padStart(l,"0");}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);}
function curTeacher(){return DB.teachers.find(x=>x.id===DB.currentTeacher);}
function gradeOf(pct){
  if(pct>=90)return {so:"Heer Sare",en:"Distinction"};
  if(pct>=75)return {so:"Aad u Wanaagsan",en:"Very Good"};
  if(pct>=60)return {so:"Wanaagsan",en:"Good"};
  return {so:"Gudbay",en:"Pass"};
}

/* merge seed + admin-added questions for a module */
function bankFor(mid){const seed=(RAW_MODULES.find(m=>m.id===mid)||{}).questions||[];
  const custom=(DB.customQuestions&&DB.customQuestions[mid])||[];return seed.concat(custom);}
function moduleById(id){return RAW_MODULES.find(m=>m.id===id);}
function mTitle(m){return LANG==="so"?m.title:m.en;}

/* ---- app state ---- */
let state={view:"home"};
function go(v,data){
  if(exam&&!exam._done&&v!=="exam"){ if(!confirm(t("Leave the exam? It will be counted as terminated.","Ma ka baxaysaa imtixaanka? Waxaa loo tirin doonaa mid la joojiyay.")))return; terminateExam(true); }
  state={view:v,...(data||{})};window.scrollTo(0,0);render();}
function toggleLang(){LANG=LANG==="en"?"so":"en";DB.lang=LANG;saveDB();render();}

/* ==================================================================
   PROGRESS MODEL
================================================================== */
function initProgress(tid){
  let p=DB.progress[tid];
  if(!p){p={moduleStatus:{},moduleScore:{},finalScore:null,finalPct:null,
    lockoutUntil:0,lockoutModule:null,certNo:null};
    MIDS.forEach((id,i)=>p.moduleStatus[id]=(i===0)?"available":"locked");
    p.moduleStatus.final="locked";DB.progress[tid]=p;}
  p.attempts=p.attempts||{};p.read=p.read||{};p.notes=p.notes||{};
  MIDS.forEach((id,i)=>{if(!p.moduleStatus[id])p.moduleStatus[id]=(i===0)?"available":"locked";});
  return p;
}
function refreshUnlocks(tid){
  const p=DB.progress[tid];if(!p)return;
  for(let i=1;i<MIDS.length;i++){
    if(p.moduleStatus[MIDS[i-1]]==="done" && p.moduleStatus[MIDS[i]]==="locked")p.moduleStatus[MIDS[i]]="available";
  }
  const allDone=MIDS.every(i=>p.moduleStatus[i]==="done");
  if(allDone && p.moduleStatus.final==="locked")p.moduleStatus.final="available";
  if(!allDone && p.moduleStatus.final!=="done")p.moduleStatus.final="locked";
}
function readCount(p,mid){return (p.read[mid]||[]).length;}
function overallPct(p){
  if(p.certNo)return 100;
  const done=MIDS.filter(i=>p.moduleStatus[i]==="done").length;
  return Math.round(done/(NMOD+1)*100);
}

function submitReg(){
  const req=["r_name","r_phone","r_school","r_zone","r_woreda","r_grades"];
  let ok=true;
  $$(".field-err").forEach(e=>e.classList.add("hide"));
  req.forEach(id=>{const v=$("#"+id).value.trim();
    if(!v){ok=false;const e=$("#"+id+"_e");e.textContent=t("Required","Waa waajib");e.classList.remove("hide");}});
  if(!ok){toast(t("Please fill the required fields.","Fadlan buuxi meelaha waajibka ah."));return;}
  const v=id=>$("#"+id).value.trim();
  const teacher={id:uid(),
    fullName:v("r_name"), teacherId:v("r_tid"), phone:v("r_phone"), school:v("r_school"),
    zone:v("r_zone"), woreda:v("r_woreda"), city:v("r_city"), grades:v("r_grades"),
    subjects:v("r_subjects"), gender:$("#r_gender").value, years:v("r_years"),
    cohort:v("r_cohort"), regDate:todayStr()};

  toast(t("Welcome, "+teacher.fullName.split(" ")[0]+"!","Ku soo dhawoow, "+teacher.fullName.split(" ")[0]+"!"));
  go("dashboard");
}

function practicePick(qi,oi){
  const qq=practice.qs[qi];if(qq.picked!==null)return;qq.picked=oi;

================================================================== */
let exam=null; // {kind:'module'|'final', mid, questions:[{q,opts:[{txt,correct}],picked,s,mid}], timer, leaves, timeLimit}
function buildQuestion(raw){
  // randomise option order, keep track of the correct one
  const opts=raw.o.map((txt,idx)=>({txt,correct:idx===raw.a}));
  return {q:raw.q,opts:shuffle(opts),picked:null,s:raw.s||"",mid:raw._mid||null};
}
function startModuleExam(mid){
  const tc=curTeacher();const p=initProgress(tc.id);
  if(p.moduleStatus[mid]==="locked"){toast(t("Module locked.","Cutubku waa xiran yahay."));return;}
  if(checkLockout(p,"m"+mid))return;
  const qs=sample(bankFor(mid),DB.settings.moduleTestCount).map(buildQuestion);
  p.attempts[mid]=(p.attempts[mid]||0)+1;saveDB();
  exam={kind:"module",mid,questions:qs,leaves:0,attempt:p.attempts[mid],
    timeLimit:DB.settings.moduleTimeMin*60};
  go("exam");
}
function startFinal(){
  const tc=curTeacher();const p=initProgress(tc.id);
  refreshUnlocks(tc.id);
  if(p.moduleStatus.final!=="available"&&p.moduleStatus.final!=="done"){toast(t("Pass all modules first.","Marka hore gudub cutubyada oo dhan."));return;}
  if(checkLockout(p,"final"))return;
  let qs=[];
  MIDS.forEach(i=>{qs=qs.concat(sample(bankFor(i),DB.settings.finalPerModule).map(q=>Object.assign({_mid:i},q)));});
  qs=shuffle(qs).map(buildQuestion);
  p.finalAttempts=(p.finalAttempts||0)+1;saveDB();
  exam={kind:"final",mid:null,questions:qs,leaves:0,attempt:p.finalAttempts,
    timeLimit:DB.settings.finalTimeMin*60};
  go("exam");
}
function checkLockout(p,key){
  if(p.lockoutUntil&&Date.now()<p.lockoutUntil&&p.lockoutModule===key){
    const mins=Math.ceil((p.lockoutUntil-Date.now())/60000);
    toast(t("Please wait "+mins+" more minute(s) before trying again.","Fadlan sug "+mins+" daqiiqo kahor intaadan mar kale isku dayin."));
    return true;
  }
  return false;
}
function viewExam(){
  const title=exam.kind==="final"?t("Final Certification Examination","Imtixaanka Shahaadaynta Dhammaadka"):
    (t("Module","Cutubka")+" "+exam.mid+" — "+t("Test","Imtixaan"));
  const qhtml=exam.questions.map((qq,qi)=>{
    const opts=qq.opts.map((o,oi)=>`<label class="opt" data-q="${qi}" data-o="${oi}">
       <input type="radio" name="q${qi}" onchange="pick(${qi},${oi})">
       <div class="ot">${esc(o.txt)}</div></label>`).join("");

      <div class="timer" id="timer">--:--</div>
    </div>
    <div class="eg" style="background:#f3ecfa;border-color:#d9c8ec">
      ${t("Answer all questions, then press Submit. Do not leave this window during the exam. Copy, paste and right-click are disabled.",
          "Ka jawaab su’aalaha oo dhan, kadib riix Gudbi. Inta imtixaanku socdo ha ka bixin daaqaddan. Koobi, dhejin iyo midig-riix waa la xiray.")}
    </div>

      <button class="btn big green" onclick="submitExam(false)">${t("Submit exam","Gudbi imtixaanka")}</button>

function pick(qi,oi){exam.questions[qi].picked=oi;
  $$('#q'+qi+' .opt').forEach((el,i)=>el.classList.toggle('sel',i===oi));
  const c=$("#ansCount");if(c)c.textContent=exam.questions.filter(q=>q.picked!==null).length;}

/* --- anti-cheat + timer wiring --- */
function attachExam(){
  // fullscreen (best-effort, needs the click gesture that opened this view)
  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}
  exam._deadline=Date.now()+exam.timeLimit*1000;
  exam.timer=setInterval(tickExam,1000);tickExam();
  ac.on();
}
function tickExam(){
  const left=Math.max(0,Math.round((exam._deadline-Date.now())/1000));
  const el=$("#timer");if(el)el.textContent=pad(Math.floor(left/60),2)+":"+pad(left%60,2);
  if(left<=0){clearInterval(exam.timer);toast(t("Time is up. Submitting.","Waqtigii waa dhammaaday. Waa la gudbinayaa."));submitExam(true);}
}
const ac={ // anti-cheat controller
  _bound:false,
  block(e){e.preventDefault();return false;},
  key(e){
    const k=(e.key||"").toLowerCase();
    if((e.ctrlKey||e.metaKey)&&["c","v","x","a","s","p","u"].includes(k)){e.preventDefault();}
    if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["i","j","c"].includes(k))){e.preventDefault();}
  },
  _last:0,
  leave(){ if(!exam||exam._done)return;
    const now=Date.now(); if(now-ac._last<1200)return; ac._last=now; ac.registerLeave(); },
  vis(){ if(document.hidden)ac.leave(); },
  registerLeave(){
    exam.leaves++;
    if(exam.leaves>DB.settings.allowedLeaves){ terminateExam(false); }
    else{ showWarn(); }
  },
  on(){ if(ac._bound)return;ac._bound=true;
    document.addEventListener("contextmenu",ac.block);
    document.addEventListener("copy",ac.block);document.addEventListener("cut",ac.block);
    document.addEventListener("paste",ac.block);document.addEventListener("selectstart",ac.block);
    document.addEventListener("keydown",ac.key,true);
    document.addEventListener("visibilitychange",ac.vis);
    window.addEventListener("blur",ac.leave);
  },
  off(){ ac._bound=false;
    document.removeEventListener("contextmenu",ac.block);
    document.removeEventListener("copy",ac.block);document.removeEventListener("cut",ac.block);
    document.removeEventListener("paste",ac.block);document.removeEventListener("selectstart",ac.block);
    document.removeEventListener("keydown",ac.key,true);
    document.removeEventListener("visibilitychange",ac.vis);
    window.removeEventListener("blur",ac.leave);
    try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
  }
};
function showWarn(){
  if($("#warnBox"))return;
  const remain=DB.settings.allowedLeaves-exam.leaves;
  const div=document.createElement("div");div.className="warnbox";div.id="warnBox";
  div.innerHTML=`<div class="inner">
    <h2>⚠ ${t("Warning","Digniin")}</h2>
    <p>${t("You left the exam window. Please return and stay in the exam.","Waad ka baxday daaqadda imtixaanka. Fadlan ku noqo oo ku sii jir imtixaanka.")}</p>
    <p class="muted small">${t("Warnings left: "+remain+". After that the exam stops and you wait "+DB.settings.examLockoutMin+" minutes before trying again.",
      "Digniinaha haray: "+remain+". Intaas kadib imtixaanku wuu istaagayaa, waxaadna sugaysaa "+DB.settings.examLockoutMin+" daqiiqo kahor intaadan mar kale isku dayin.")}</p>
    <button class="btn" onclick="closeWarn()">${t("Return to exam","Ku noqo imtixaanka")}</button></div>`;
  document.body.appendChild(div);
}
function closeWarn(){const w=$("#warnBox");if(w)w.remove();
  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}}
function terminateExam(silent){
  if(!exam||exam._done)return;exam._done=true;clearInterval(exam.timer);ac.off();
  const tc=curTeacher();const p=initProgress(tc.id);
  p.lockoutUntil=Date.now()+DB.settings.examLockoutMin*60000;
  p.lockoutModule=exam.kind==="final"?"final":("m"+exam.mid);
  DB.results.push({id:uid(),teacherId:tc.id,type:exam.kind,mid:exam.mid,attempt:exam.attempt,
    score:0,total:exam.questions.length,pct:0,terminated:true,date:new Date().toISOString()});
  saveDB();
  if(silent)return;
  const w=$("#warnBox");if(w)w.remove();
  const div=document.createElement("div");div.className="warnbox";div.id="warnBox";
  div.innerHTML=`<div class="inner">
    <h2>${t("Exam stopped","Imtixaanka waa la joojiyay")}</h2>
    <p>${t("The exam was stopped because you left the exam window.","Imtixaanka waa la joojiyay sababtoo ah waad ka baxday daaqadda imtixaanka.")}</p>
    <p>${t("Do not worry: you can try again after "+DB.settings.examLockoutMin+" minutes. Use the time to review the lessons.",
      "Ha welwelin: waad isku dayi kartaa "+DB.settings.examLockoutMin+" daqiiqo kadib. Waqtigaas ku dib u akhri casharrada.")}</p>
    <button class="btn" onclick="closeWarnDash()">${t("Return to dashboard","Ku noqo bogga hore")}</button></div>`;
  document.body.appendChild(div);
}
function closeWarnDash(){const w=$("#warnBox");if(w)w.remove();exam=null;go("dashboard");}

function submitExam(auto){
  if(!exam||exam._done)return;
  const unanswered=exam.questions.filter(q=>q.picked===null).length;
  if(!auto&&unanswered>0){
    if(!confirm(t(unanswered+" question(s) not answered. Submit anyway?",unanswered+" su’aalood lagama jawaabin. Ma gudbinaysaa si kastaba?")))return;
  }
  exam._done=true;clearInterval(exam.timer);ac.off();
  let correct=0;const review=[];const byMod={};
  exam.questions.forEach(q=>{const ok=q.picked!==null&&q.opts[q.picked].correct;if(ok)correct++;
    if(q.mid){byMod[q.mid]=byMod[q.mid]||{c:0,n:0};byMod[q.mid].n++;if(ok)byMod[q.mid].c++;}
    review.push({q:q.q,ok,picked:q.picked===null?null:q.opts[q.picked].txt,right:q.opts.find(o=>o.correct).txt,s:q.s});});
  const total=exam.questions.length;const pct=Math.round(correct/total*100);
  const tc=curTeacher();const p=initProgress(tc.id);
  const passMark=exam.kind==="final"?DB.settings.finalPassPct:DB.settings.modulePassPct;
  const passed=pct>=passMark;
  DB.results.push({id:uid(),teacherId:tc.id,type:exam.kind,mid:exam.mid,attempt:exam.attempt,
    score:correct,total,pct,terminated:false,passed,date:new Date().toISOString()});
  if(exam.kind==="module"){
    const prev=p.moduleScore[exam.mid];
    if(!prev||pct>=prev.pct)p.moduleScore[exam.mid]={pct,score:correct,total};
    if(passed){p.moduleStatus[exam.mid]="done";refreshUnlocks(tc.id);}
  }else{
    if(!p.finalPct||pct>=p.finalPct){p.finalScore=correct;p.finalPct=pct;}
    if(passed){p.moduleStatus.final="done";
      if(!p.certNo){p.certNo=makeCertificate(tc,pct);} }
  }
  saveDB();
  const res={kind:exam.kind,mid:exam.mid,attempt:exam.attempt,correct,total,pct,passed,passMark,certNo:p.certNo,review,byMod};
  exam=null;
  go("result",{res});
}

function makeCertificate(tc,pct){
  DB.certSeq=(DB.certSeq||0)+1;
  const year=new Date().getFullYear();
  const certNo="SREB-TTP-"+year+"-"+pad(DB.certSeq,6);
  const vc=(uid()+uid()).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12);
  const verifyCode=vc.slice(0,4)+"-"+vc.slice(4,8)+"-"+vc.slice(8,12);
  DB.certificates.push({certNo,verifyCode,teacherId:tc.id,name:tc.fullName,gender:tc.gender||"",
    school:tc.school,zone:tc.zone,woreda:tc.woreda,city:tc.city,phone:tc.phone,
    grades:tc.grades,score:pct,modules:NMOD,date:todayStr(),status:"VALID"});
  saveDB();return certNo;
}

function fitCert(){
  const box=$("#certFit"),c=$("#theCert");if(!box||!c)return;
  const area=$("#certArea");const padX=area?parseFloat(getComputedStyle(area).paddingLeft)*2:0;
  const s=Math.min(1,(box.clientWidth-padX)/CERT_W);
  c.style.transform=`scale(${s})`;
  area.style.height=(CERT_H*s+padX)+"px";
}

function afterCert(){
  const c=state.view==="sample"?SAMPLE_CERT:DB.certificates.find(x=>x.certNo===state.certNo);if(!c)return;
  try{
    const payload="SREB-CERT|"+c.certNo+"|"+c.verifyCode+"|"+c.name+"|"+c.score+"%";
    const qr=qrcode(0,"M");qr.addData(unescape(encodeURIComponent(payload)));qr.make();
    $("#qrBox").innerHTML=qr.createImgTag(4,0);
  }catch(e){$("#qrBox").innerHTML='<div class="muted small">QR</div>';}
  fitCert();
}
